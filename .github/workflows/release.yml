name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
            ext: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            rust: stable
            ext: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: stable
            ext: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
            ext: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SourceForge ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          args: --target ${{ matrix.target }}

      - name: Generate SHA256 checksums (Windows)
        if: matrix.ext == 'windows'
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          Get-ChildItem -Path $bundleDir -Recurse -Include *.msi,*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "checksums-${{ matrix.ext }}.txt" -Append -Encoding utf8
          }

      - name: Generate SHA256 checksums (macOS)
        if: startsWith(matrix.ext, 'macos')
        shell: bash
        run: |
          shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > checksums-${{ matrix.ext }}.txt

      - name: Generate SHA256 checksums (Linux)
        if: matrix.ext == 'linux'
        shell: bash
        run: |
          sha256sum src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage > checksums-${{ matrix.ext }}.txt

      - name: Upload checksums
        if: always() && (steps.tauri.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "checksums-${{ matrix.ext }}.txt") {
            gh release upload ${{ github.ref_name }} "checksums-${{ matrix.ext }}.txt" --repo ${{ github.repository }}
          }
        shell: pwsh
